name: Windows

# Phase 6 (docs/SparkGlass_ROADMAP.md): SparkGlass is developed on Linux, but
# needs to be proven on real Windows too — nothing here should be trusted
# just because it *compiles* on Linux (docs/SparkGlass_HANDOFF.md's own
# rule). GitHub's windows-latest runners are the only real Windows this
# project has access to, so this workflow is the actual verification, not
# a formality: every job here does something a Linux dev box provably
# cannot.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      # main.rs is the macroquad Linux reference/dev-tool binary — not
      # part of the `--lib` target either job here builds, so changes to
      # it can never affect this workflow's outcome. Excluded so it stops
      # triggering a ~20-40min ANGLE build for nothing.
      - "!src/main.rs"
      - "include/**"
      - "c_smoke/**"
      - "Cargo.toml"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "src/**"
      - "!src/main.rs"
      - "include/**"
      - "c_smoke/**"
      - "Cargo.toml"
  workflow_dispatch:

# c-abi-smoke's vcpkg step builds ANGLE from source (20-40 min); without
# this, pushing twice in quick succession runs two full copies of that in
# parallel instead of the newer push just cancelling the stale one.
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build-and-test:
    # Native x86_64-pc-windows-msvc — the real target triple, not a Linux
    # cross-compile. Proves the crate (including its Windows-specific
    # `#[cfg]` paths, if any get added later) actually builds with MSVC's
    # toolchain and linker, and that src/glass.rs's pure-Rust logic
    # (geometry math, preset() bucketing, the unit tests) behaves
    # identically on Windows — floating point and struct layout included.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo build --release --lib
        run: cargo build --release --lib
      - name: cargo test --lib
        run: cargo test --lib
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Confirm the cdylib exports the C ABI
        # dumpbin ships with the MSVC toolchain the runner already has, but
        # only on PATH inside a Developer Command Prompt — ilammy/msvc-dev-cmd
        # sets that up for every later step in this job (first attempt at
        # this workflow forgot that and got "dumpbin not recognized"). This
        # check is the Windows-native equivalent of the
        # `x86_64-w64-mingw32-objdump -p` check used to verify the mingw
        # cross-build locally — same claim, proven on the real target this
        # time.
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter "spark_glass.dll" target/release | Select-Object -First 1
          if (-not $dll) { throw "spark_glass.dll not found under target/release" }
          $exports = & dumpbin /exports $dll.FullName
          $expected = @(
            "sg_create", "sg_destroy", "sg_resize", "sg_import_gl_texture",
            "sg_release_texture", "sg_set_backdrop", "sg_render_frame",
            "sg_present", "sg_last_error"
          )
          $missing = $expected | Where-Object { ($exports -join "`n") -notmatch $_ }
          if ($missing) { throw "Missing exports: $($missing -join ', ')" }
          Write-Host "All 9 C ABI exports present in $($dll.Name)"

  c-abi-smoke:
    # The real test: a pure-C program (c_smoke/main.c, the same file
    # verified on Linux by scripts/verify_backends.sh) built with MSVC and
    # linked against the Windows cdylib, driven through a real EGL context
    # from Google ANGLE — the exact EGL/GLES surface SparkGlass's Windows
    # host (WinUI 3 + SwapChainPanel) is meant to run on, per
    # docs/SparkGlass_ROADMAP.md §3's target architecture. This is the
    # first time this project has ever run SparkGlass-rendered pixels
    # through ANGLE at all, on any platform.
    runs-on: windows-latest
    # ANGLE builds from source in vcpkg (it's a slice of Chromium's shader
    # compiler + D3D11 backend) and commonly takes 20-40 minutes on a cold
    # cache. That's real work, not a hang — but bound it explicitly so an
    # actual hang fails loudly instead of running until GitHub's default
    # 6-hour job timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: cargo build --release --lib
        run: cargo build --release --lib
      - name: Cache vcpkg's built ANGLE binaries
        # Building ANGLE from source is the slow part of this job (20-40
        # min cold); vcpkg's binary caching means every run after the
        # first reuses the compiled output instead of rebuilding it. Key
        # is deliberately NOT hashFiles(this workflow) — that seemed like
        # a reasonable invalidation trigger at first, but this file gets
        # edited on nearly every iteration while debugging it, which
        # meant the cache key changed almost every run and never actually
        # hit. Bump the trailing version suffix by hand if the pinned
        # ANGLE/vcpkg port version ever needs to change; runner.os alone
        # still invalidates it on a GitHub-side image change.
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\vcpkg-cache
          key: vcpkg-angle-x64-windows-${{ runner.os }}-v1
      - name: Install ANGLE (EGL/GLESv2) via vcpkg
        # The classic/desktop triplet, not a UWP package — c_smoke.exe is a
        # plain Win32 console app. (Microsoft's ANGLE.WindowsStore NuGet
        # package was considered instead, since it's prebuilt and much
        # faster, but its own docs say it's UWP-only and a desktop app
        # "must obtain the binaries via another method" — so this is the
        # correct choice, just a slower one.)
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ runner.temp }}\\vcpkg-cache,readwrite"
        run: |
          vcpkg install angle:x64-windows
        shell: pwsh
      - name: Locate vcpkg install root
        id: vcpkg
        shell: pwsh
        run: |
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          if (-not (Test-Path $root)) { throw "vcpkg install root not found at $root" }
          echo "root=$root" >> $env:GITHUB_OUTPUT
      - name: Compile and link c_smoke with MSVC
        # ilammy/msvc-dev-cmd already set up the Developer environment for
        # this job, so cl.exe/link.exe are just on PATH here — no manual
        # vcvars64.bat call needed (the first draft of this workflow
        # hardcoded a vcvars64.bat path per-VS-edition instead; this is
        # both simpler and more portable across runner images).
        shell: pwsh
        run: |
          cl.exe /nologo c_smoke\main.c `
            /I include `
            /I "${{ steps.vcpkg.outputs.root }}\include" `
            /Fe:c_smoke.exe `
            /link /LIBPATH:target\release `
            /LIBPATH:"${{ steps.vcpkg.outputs.root }}\lib" `
            spark_glass.dll.lib libEGL.lib libGLESv2.lib
      - name: Copy runtime DLLs next to the smoke test
        shell: pwsh
        run: |
          Copy-Item target\release\spark_glass.dll .
          Copy-Item "${{ steps.vcpkg.outputs.root }}\bin\libEGL.dll" .
          Copy-Item "${{ steps.vcpkg.outputs.root }}\bin\libGLESv2.dll" .
          # ANGLE's D3D11 backend needs d3dcompiler_47.dll at runtime (HLSL
          # compilation) — it's a transitive dependency of libGLESv2.dll,
          # so it never showed up in `dumpbin /dependents` on c_smoke.exe
          # or spark_glass.dll directly (see the previous run's diagnostic
          # step, now confirmed: exit code -1073741515 = STATUS_DLL_NOT_FOUND).
          # Not guaranteed present system-wide, but always shipped with the
          # Windows SDK, which this runner already has.
          $d3dcompiler = Get-ChildItem -Recurse -Filter "d3dcompiler_47.dll" `
            "C:\Program Files (x86)\Windows Kits\10\Redist" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          if (-not $d3dcompiler) { throw "d3dcompiler_47.dll not found under the Windows Kits redist directory" }
          Copy-Item $d3dcompiler.FullName .
      - name: Check DLL dependencies before running
        # Kept even after finding the d3dcompiler_47.dll gap (see above) —
        # dumpbin only shows *direct* link-time dependencies, so it won't
        # catch every transitive one, but it's still the first thing to
        # check if this ever regresses again.
        shell: pwsh
        run: |
          dumpbin /dependents c_smoke.exe
          dumpbin /dependents spark_glass.dll
      - name: Run c_smoke.exe
        shell: pwsh
        run: |
          & .\c_smoke.exe
          $code = $LASTEXITCODE
          Write-Host "c_smoke.exe exit code: $code"
          if ($code -ne 0) { throw "c_smoke.exe failed with exit code $code" }
