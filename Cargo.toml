[package]
name = "spark_glass"
version = "0.1.0"
edition = "2024"
description = "SparkGlass — an Analogic Goose GPU visual-material engine that reproduces Apple's Liquid Glass"
license = "MIT"
authors = ["Analogic Goose"]
repository = "https://github.com/AnalogicGoose/SparkGlass"

[lib]
# rlib for the binary/examples, cdylib so an external C/C++ host can actually
# link against it (see c_smoke/ for a real, non-Rust consumer of src/ffi/).
crate-type = ["rlib", "cdylib"]

[dependencies]
macroquad = "0.4.16"
image = "0.24"
glam = "0.27"
glow = "0.14"

[dev-dependencies]
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
libloading = "0.8"

# Phase 5 (Linux/GTK4 integration) is Linux-only by design — see
# examples/gtk_glarea.rs / gtk_glarea_overlay.rs. gtk4-sys needs pkg-config
# + system GTK dev headers that don't exist on the windows-latest CI runner
# (.github/workflows/windows.yml), and there's no reason to try to make
# them exist: nothing here claims GTK4-on-Windows support. Scoping this to
# Linux means `cargo test --lib`/`cargo build --all-targets` on Windows
# don't need it at all, instead of failing on a dependency the Windows
# build was never going to use.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gtk4 = "0.11.4"
