[package]
name = "spark_glass_poc"
version = "0.1.0"
edition = "2024"
description = "SparkGlass — an Analogic Goose GPU visual-material proof of concept inspired by Apple's Liquid Glass"
license = "MIT"
authors = ["Analogic Goose"]
repository = "https://github.com/AnalogicGoose/SparkGlass"

[lib]
# rlib for the binary/examples, cdylib so an external C/C++ host can actually
# link against it (see c_smoke/ for a real, non-Rust consumer of src/ffi/).
crate-type = ["rlib", "cdylib"]

[dependencies]
macroquad = "0.4.16"
image = "0.24"
glam = "0.27"
glow = "0.14"

[dev-dependencies]
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
gtk4 = "0.11.4"
libloading = "0.8"
